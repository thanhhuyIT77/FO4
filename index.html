<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bảng tỉ số - Solo FIFA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --accent:#ffd166; --text:#e8f3ef; --muted:#a8c3bb; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            background:
                linear-gradient(180deg, rgba(0,0,0,0.55), rgba(0,0,0,0.6)),
                url('https://images.pexels.com/photos/114296/pexels-photo-114296.jpeg?auto=compress&cs=tinysrgb&h=1080') center/cover no-repeat fixed;
            color: var(--text);
            font-family: 'Montserrat', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            display: grid; grid-template-rows: auto 1fr auto; gap: 24px; padding: 24px;
        }
        header { display:flex; align-items:center; justify-content:space-between; }
        .brand { display:flex; align-items:center; gap:12px; font-weight:700; letter-spacing:.5px; }
        .brand .dot { width:10px; height:10px; background:#06d6a0; border-radius:50%; box-shadow:0 0 12px #06d6a0; }
        .container { display:grid; grid-template-columns:1.3fr 1fr; gap:24px; }
        @media (max-width: 960px){ .container{ grid-template-columns:1fr; } }
        .scoreboard { background:rgba(11,19,32,.6); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.08); border-radius:16px; padding:24px; box-shadow:0 10px 30px rgba(0,0,0,.25); }
        .score-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
        .status { padding:6px 10px; border-radius:999px; background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,0)); border:1px solid rgba(255,255,255,.12); color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:1px; }
        .teams { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:16px; margin-top:10px; }
        .team { display:grid; grid-template-columns:56px 1fr; align-items:center; gap:12px; }
        .team.right { direction: rtl; }
        .logo { width:56px; height:56px; border-radius:12px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); display:grid; place-items:center; overflow:hidden; }
        .logo img { width:100%; height:100%; object-fit:cover; }
        .name { font-size:20px; font-weight:700; text-transform:uppercase; }
        .score { font-family:'Roboto Condensed', sans-serif; font-size:60px; font-weight:700; background:linear-gradient(180deg,#fff,#cde7df); -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:0 12px 28px rgba(0,0,0,.35); min-width:120px; text-align:center; }
        .controls { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:18px; }
        .panel { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); border-radius:14px; padding:16px; }
        .panel h3 { margin:0 0 10px; font-size:14px; letter-spacing:.5px; color:var(--muted); text-transform:uppercase; }
        label { font-size:13px; color:var(--muted); display:block; margin-bottom:6px; }
        input { width:100%; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.15); background:rgba(11,19,32,.5); color:var(--text); outline:none; }
        .btn { appearance:none; border:1px solid rgba(255,255,255,.12); background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.02)); color:var(--text); padding:10px 14px; border-radius:12px; cursor:pointer; transition:.15s ease; }
        .btn:hover { transform:translateY(-1px); border-color:rgba(255,255,255,.25); }
        .btn.primary { background:linear-gradient(180deg, var(--accent), #ffb703); color:#0b1320; border:none; font-weight:700; }
        .btn.danger { background:linear-gradient(180deg, #ff7b7b, #ff4d4d); color:#0b1320; border:none; font-weight:700; }
        footer { color:var(--muted); font-size:12px; text-align:center; }
    </style>
</head>
<body>
    <header>
        <div class="brand"><span class="dot"></span> Live Football Board</div>
    </header>

    <div class="container">
        <section class="scoreboard">
            <div class="score-header">
                <div class="status">Giải đấu: <span id="league">Giao hữu</span></div>
            </div>
            <div class="teams">
                <div class="team">
                    <div class="logo"><img id="homeLogoImg" alt="home logo"></div>
                    <div class="name" id="homeNamePreview">a CHề</div>
                </div>
                <div class="score" id="homeScore">0</div>
                <div></div>
                <div></div>
                <div class="score" id="awayScore">0</div>
                <div class="team right">
                    <div class="logo"><img id="awayLogoImg" alt="away logo"></div>
                    <div class="name" id="awayNamePreview">Huy Messi</div>
                </div>
            </div>
        </section>

        <aside class="panel">
            <h3>Điều khiển</h3>
            <div class="controls">
                <div>
                    <label>Tỉ số đội nhà</label>
                    <input id="homeScoreInput" type="number" min="0" value="0">
                    <div style="display:flex; gap:8px; align-items:center;">
                        <button class="btn" onclick="inc('homeScore', -1)">-1</button>
                        <button class="btn primary" onclick="inc('homeScore', +1)">+1</button>
                    </div>
                </div>
                <div>
                    <label>Tỉ số đội khách</label>
                    <input id="awayScoreInput" type="number" min="0" value="0">
                    <div style="display:flex; gap:8px; align-items:center;">
                        <button class="btn" onclick="inc('awayScore', -1)">-1</button>
                        <button class="btn primary" onclick="inc('awayScore', +1)">+1</button>
                    </div>
                </div>
                <div>
                    <label>&nbsp;</label>
                    <button class="btn primary" onclick="saveScores()">Lưu tỉ số (trình duyệt)</button>
                </div>
                <div>
                    <label>&nbsp;</label>
                    <button class="btn" onclick="loadScores()">Tải lại</button>
                </div>
                <div>
                    <label>&nbsp;</label>
                    <button class="btn danger" onclick="resetScores()">Reset tỉ số</button>
                </div>
                <div style="grid-column: 1 / -1; margin-top:4px;">
                    <button class="btn" onclick="saveResult()">Lưu kết quả vào lịch sử</button>
                </div>
                <div style="grid-column: 1 / -1;">
                    <h3>Lịch sử gần đây</h3>
                    <div id="history"></div>
                </div>
            </div>
        </aside>
    </div>

    <footer>Static version for GitHub Pages. Dữ liệu lưu bằng localStorage.</footer>

    <script>
        const FIXED = {
            homeName: 'a CHề',
            homeLogo: 'https://i.imgur.com/m4M5tJz.jpeg',
            awayName: 'Huy Messi',
            awayLogo: 'https://i.imgur.com/2GNbDW6.jpeg'
        };
        function syncPreview(){
            document.getElementById('homeNamePreview').textContent = FIXED.homeName;
            document.getElementById('awayNamePreview').textContent = FIXED.awayName;
            const hl = document.getElementById('homeLogoImg');
            const al = document.getElementById('awayLogoImg');
            hl.src = FIXED.homeLogo; al.src = FIXED.awayLogo;
            const hsi = document.getElementById('homeScoreInput');
            const asi = document.getElementById('awayScoreInput');
            document.getElementById('homeScore').textContent = Number(hsi.value || 0);
            document.getElementById('awayScore').textContent = Number(asi.value || 0);
        }
        function inc(which, delta){
            const el = document.getElementById(which === 'homeScore' ? 'homeScoreInput' : 'awayScoreInput');
            el.value = Math.max(0, Number(el.value) + delta);
            syncPreview();
        }
        function saveScores(){
            const data = {
                home: { name: FIXED.homeName, logo: FIXED.homeLogo, score: Number(document.getElementById('homeScoreInput').value) },
                away: { name: FIXED.awayName, logo: FIXED.awayLogo, score: Number(document.getElementById('awayScoreInput').value) }
            };
            localStorage.setItem('solo-score', JSON.stringify(data));
            toast('Đã lưu tỉ số');
        }
        function loadScores(){
            const raw = localStorage.getItem('solo-score');
            if (!raw) { syncPreview(); return; }
            try{
                const data = JSON.parse(raw);
                document.getElementById('homeScoreInput').value = Number(data?.home?.score || 0);
                document.getElementById('awayScoreInput').value = Number(data?.away?.score || 0);
            }catch(e){}
            syncPreview();
        }
        function resetScores(){
            document.getElementById('homeScoreInput').value = 0;
            document.getElementById('awayScoreInput').value = 0;
            syncPreview();
        }
        function saveResult(){
            const raw = localStorage.getItem('solo-history');
            const list = raw ? (JSON.parse(raw)||[]) : [];
            const item = {
                home: { name: FIXED.homeName, score: Number(document.getElementById('homeScoreInput').value) },
                away: { name: FIXED.awayName, score: Number(document.getElementById('awayScoreInput').value) },
                savedAt: new Date().toISOString()
            };
            list.push(item);
            localStorage.setItem('solo-history', JSON.stringify(list));
            toast('Đã lưu vào lịch sử');
            listHistory();
        }
        function listHistory(){
            const raw = localStorage.getItem('solo-history');
            const arr = raw ? (JSON.parse(raw)||[]) : [];
            const wrap = document.getElementById('history');
            wrap.innerHTML = '';
            arr.slice(-10).reverse().forEach(item => {
                const row = document.createElement('div');
                row.style.display='grid'; row.style.gridTemplateColumns='1fr auto 1fr'; row.style.alignItems='center'; row.style.gap='8px'; row.style.padding='6px 0';
                row.innerHTML = `<span>${item.home.name} <b>${item.home.score}</b></span><span style="opacity:.7">${new Date(item.savedAt||'').toLocaleString()}</span><span style="text-align:right"><b>${item.away.score}</b> ${item.away.name}</span>`;
                wrap.appendChild(row);
            });
        }
        function toast(msg){
            const el = document.createElement('div');
            el.textContent = msg;
            el.style.position = 'fixed'; el.style.bottom = '20px'; el.style.right = '20px';
            el.style.padding = '10px 14px'; el.style.borderRadius = '10px'; el.style.background = '#06d6a0'; el.style.color = '#0b1320'; el.style.fontWeight = '700'; el.style.boxShadow = '0 10px 24px rgba(0,0,0,.25)';
            document.body.appendChild(el); setTimeout(()=>el.remove(),1600);
        }
        document.addEventListener('DOMContentLoaded', ()=>{ ['homeScoreInput','awayScoreInput'].forEach(id=>document.getElementById(id).addEventListener('input', syncPreview)); loadScores(); listHistory(); });
    </script>
</body>
</html>
